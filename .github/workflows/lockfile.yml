name: Regenerate lockfile on Linux

# Manual, on-demand. The lockfile has to be resolved on Linux, because that is
# what both this CI and Netlify build on. A macOS-resolved lockfile hoists part of
# the tree differently (chokidar needs picomatch@2, tinyglobby needs picomatch@4)
# and `npm ci` then refuses to install.
#
# Run it from the Actions tab, or: gh workflow run lockfile.yml --ref <branch>
# Then download the artifact and commit the lockfile.
# workflow_dispatch only works once this file is on the default branch, so while
# it lives on a feature branch it is also triggered by pushing this file itself.
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/lockfile.yml"

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Resolve dependencies from scratch on Linux
        run: |
          rm -rf node_modules package-lock.json
          npm install --no-audit --no-fund

      - name: Prove `npm ci` accepts the result
        run: |
          rm -rf node_modules
          npm ci

      - name: Show what changed
        run: |
          node -e "const d=require('./package-lock.json');for(const[k,v]of Object.entries(d.packages))if(k.includes('picomatch'))console.log(k,'->',v.version)"

      - uses: actions/upload-artifact@v4
        with:
          name: package-lock
          path: package-lock.json
          retention-days: 7
