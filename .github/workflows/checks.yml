name: Site checks

# Runs on every push and pull request, including the commits Keystatic makes when
# Theresa saves an edit in the admin. If the compliance check fails, the build
# fails and Netlify does not publish the change.
on:
  push:
  pull_request:

jobs:
  verify:
    name: Compliance, build and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      # `npm install`, not `npm ci`, and deliberately so.
      #
      # The lockfile is generated on macOS (arm64). On Linux npm hoists the tree
      # differently — chokidar's anymatch/readdirp need picomatch@2 while
      # tinyglobby needs picomatch@4, and the two platforms disagree about which
      # one belongs at the root of node_modules. `npm ci` requires the lockfile to
      # match the resolved tree exactly, so it fails on the runner with
      # "lock file's picomatch@2.3.2 does not satisfy picomatch@4.0.5".
      #
      # `npm install` honours the lockfile where it can and reconciles the few
      # platform-dependent positions where it cannot. The lockfile stays committed
      # for local development. If we ever want strict `npm ci` here, the lockfile
      # has to be generated on Linux.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # This one comes first, and on purpose: if the wording is wrong we want to
      # say so in plain language before anything else has a chance to fail.
      - name: Check the wording (counselling-only compliance)
        run: npm run check:compliance

      # Guards against a Keystatic schema that would silently drop content on save.
      - name: Check the admin cannot drop content
        run: npm run check:schema

      - name: Build the site
        run: npm run build

      - name: Lint
        run: npm run lint
