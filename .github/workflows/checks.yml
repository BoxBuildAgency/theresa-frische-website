name: Site checks

# Runs on every push and pull request, including the commits Keystatic makes when
# Theresa saves an edit in the admin.
#
# Every step here is blocking: GitHub fails the job on the first non-zero exit,
# and a failed job means the commit is not safe to publish. The two schema steps
# are the ones that matter for her being able to edit at all — a schema change
# that would leave an entry unopenable cannot get past them.
on:
  push:
  pull_request:

jobs:
  verify:
    name: Compliance, build and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # Strict install. The lockfile is generated on Linux (see
      # .github/workflows/lockfile.yml), which is what this runner and Netlify
      # both build on, so `npm ci` can enforce it exactly. If this ever fails with
      # "can only install packages when your package.json and package-lock.json
      # are in sync", the lockfile was regenerated on macOS — run the lockfile
      # workflow and commit the artifact rather than switching to `npm install`.
      - name: Install dependencies
        run: npm ci

      # This one comes first, and on purpose: if the wording is wrong we want to
      # say so in plain language before anything else has a chance to fail.
      - name: Check the wording (counselling-only compliance)
        run: npm run check:compliance

      # Proves the guard below still fails on each breakage it claims to catch.
      # It runs first: a guard that has quietly stopped working would otherwise
      # report green over a real problem, which has now happened twice.
      - name: Test the schema guard itself
        run: npm run test:schema-guard

      # Blocking. Fails if any entry would refuse to open in the admin, if a save
      # would drop content, or if the site renders a field the CMS cannot edit.
      - name: Check every admin entry opens and saves cleanly
        run: npm run check:schema

      - name: Build the site
        run: npm run build

      - name: Lint
        run: npm run lint
