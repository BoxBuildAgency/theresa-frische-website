# Netlify configuration for the Next.js (App Router) build.
# The official Next.js plugin handles SSR/route handlers, image optimisation,
# and the app's server functions.

[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  # Node 20 reached end of life in April 2026. 22 is the active LTS.
  NODE_VERSION = "22"

# Long-cache the optimised, fingerprinted static assets.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Sensible security headers (privacy-first; no third-party scripts at launch).
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
